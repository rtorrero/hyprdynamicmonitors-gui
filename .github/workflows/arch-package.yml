name: Build Arch package

on:
  push:
    branches: [gui]
  workflow_dispatch:

permissions:
  contents: write # needed to update the rolling "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed git go gtk4 gobject-introspection gnupg

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so pkgver() can count commits

      - name: Prepare unprivileged build user
        run: |
          useradd -m builder
          chown -R builder:builder .
          git config --global --add safe.directory '*'
          su builder -c "git config --global --add safe.directory '*'"

      - name: Build package with makepkg
        run: su builder -c "cd packaging/arch && makepkg -f --noconfirm --cleanbuild"

      - name: Locate built package
        id: pkg
        run: |
          f=$(ls packaging/arch/*.pkg.tar.zst | head -1)
          # Stable-named copy so the release download URL never changes.
          stable="packaging/arch/hyprdynamicmonitors-gui-x86_64.pkg.tar.zst"
          cp "$f" "$stable"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"

      - name: Sign packages
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          for f in "${{ steps.pkg.outputs.file }}" "${{ steps.pkg.outputs.stable }}"; do
            gpg --batch --pinentry-mode loopback --detach-sign --no-armor -u "$fpr" "$f"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: ${{ steps.pkg.outputs.file }}
          if-no-files-found: error

      - name: Update rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Arch build
          body: |
            Rolling Arch Linux package built from the latest `gui` commit
            (`${{ github.sha }}`).

            First time on a machine, trust the package signing key:
            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/gui/packaging/arch/signing-key.asc | sudo pacman-key --add -
            sudo pacman-key --lsign-key A7A9F67C016EC5A69056491065C6B687EC34A7E3
            ```
            Then install (stable URL, always the newest build):
            ```sh
            sudo pacman -U https://github.com/${{ github.repository }}/releases/download/latest/hyprdynamicmonitors-gui-x86_64.pkg.tar.zst
            ```
          prerelease: true
          files: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.pkg.outputs.file }}.sig
            ${{ steps.pkg.outputs.stable }}
            ${{ steps.pkg.outputs.stable }}.sig
